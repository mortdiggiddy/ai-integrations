      stroke-dasharray: 1 4;
      opacity: 0.48;
    }
.c-grid{
      stroke-dasharray: 1 3;
      opacity: 0.78;
    }</style><rect width="100%" height="100%" fill="#020617"/>
        <title id="archify-diagram-title">Workspace recovery: qualify publication</title>
        <desc id="archify-diagram-description">October 8 Issue 31 revision | proposals awaiting backend proof</desc>
        <!-- Definitions -->
