.m-emphasis{ fill: #34d399; }
.m-security{ fill: #fb7185; }
.m-dashed{ fill: #a78bfa; }
.c-grid{
      stroke-dasharray: 1 4;
      opacity: 0.48;
    }
.c-grid{
      stroke-dasharray: 1 3;
      opacity: 0.78;
    }</style><rect width="100%" height="100%" fill="#020617"/>
        <title id="archify-diagram-title">Effect succeeded; result publication failed</title>
        <desc id="archify-diagram-description">Proposed fault oracle | retry must not repeat a physical effect</desc>
        <!-- Definitions -->
