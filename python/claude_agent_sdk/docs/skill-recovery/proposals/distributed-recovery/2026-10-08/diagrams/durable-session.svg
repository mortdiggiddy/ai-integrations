<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 674" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase"><style>text { font-family: Arial, sans-serif; }
