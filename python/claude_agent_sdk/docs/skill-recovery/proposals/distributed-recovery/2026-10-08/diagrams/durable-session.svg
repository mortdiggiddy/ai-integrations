.m-security{ fill: #fb7185; }
.m-dashed{ fill: #a78bfa; }</style><rect width="100%" height="100%" fill="#020617"/>
        <title id="archify-diagram-title">Durable Claude session</title>
        <desc id="archify-diagram-description">Proposed composition | accepted boundaries, independent effect authority</desc>
        <!-- Definitions -->
        <defs>
